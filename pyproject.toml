[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlineage"
version = "0.3.7"
description = "Local-first provenance, uncertainty, and audit trails for electrical-engineering experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shurong Cao" }]
keywords = [
  "electrical-engineering",
  "experiment",
  "provenance",
  "reproducibility",
  "metrology",
  "uncertainty",
  "laboratory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://caoshurong.github.io/benchlineage/"
Documentation = "https://github.com/CAOShurong/benchlineage#readme"
Repository = "https://github.com/CAOShurong/benchlineage"
Issues = "https://github.com/CAOShurong/benchlineage/issues"
Changelog = "https://github.com/CAOShurong/benchlineage/blob/main/CHANGELOG.md"
Discussions = "https://github.com/CAOShurong/benchlineage/discussions"

[project.scripts]
benchlineage = "benchlineage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
