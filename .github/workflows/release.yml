name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel, bundle, and ELN exchange in a clean environment
        run: |
          demo_version="${GITHUB_REF_NAME#v}"
          demo_zip="dist/benchlineage-${demo_version}-demo.zip"
          demo_eln="dist/benchlineage-${demo_version}-demo.eln"
          python -m venv clean-install
          clean-install/bin/python -m pip install dist/*.whl
          clean-install/bin/benchlineage demo release-demo
          clean-install/bin/benchlineage audit release-demo
          clean-install/bin/benchlineage verify release-demo
          clean-install/bin/benchlineage bundle release-demo --output "$demo_zip"
          clean-install/bin/benchlineage verify-bundle "$demo_zip"
          clean-install/bin/benchlineage export-eln release-demo --output "$demo_eln"
          clean-install/bin/benchlineage verify-eln "$demo_eln"
          clean-install/bin/python -c "from benchlineage import verify_eln; assert verify_eln('$demo_eln')['root_name_matches_archive']"
          clean-install/bin/benchlineage diff-seals release-demo/seals/*.json release-demo/seals/*.json
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.zip *.eln > SHA256SUMS
      - name: Preserve verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.eln
            dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/benchlineage
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Keep only package distributions for PyPI
        run: rm dist/SHA256SUMS dist/*.zip dist/*.eln
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-github:
    name: Publish GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "BenchLineage ${GITHUB_REF_NAME}"
