<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">BenchLineage evidence workflow</title>
  <desc id="desc">Six research-evidence stages, from study intent through bench traceability, raw observation, analysis, audit, and a publication bundle.</desc>
  <rect width="1400" height="430" rx="8" fill="#faf9f5"/>
  <rect x="1" y="1" width="1398" height="428" rx="7" fill="none" stroke="#d5d2ca"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="62" y="58" fill="#172a35" font-family="Georgia,Times New Roman,serif" font-size="29" font-weight="700">One chain, six explicit claims</text>
    <text x="62" y="87" fill="#647178" font-size="15">Each stage records what is known, what is inferred, and which artifact supports it.</text>

    <line x1="124" y1="191" x2="1260" y2="191" stroke="#9ba5a9" stroke-width="2"/>
    <g fill="#faf9f5" stroke-width="3">
      <circle cx="124" cy="191" r="21" stroke="#1f5b61"/>
      <circle cx="352" cy="191" r="21" stroke="#1f5b61"/>
      <circle cx="580" cy="191" r="21" stroke="#1f5b61"/>
      <circle cx="808" cy="191" r="21" stroke="#b5792d"/>
      <circle cx="1036" cy="191" r="21" stroke="#1f5b61"/>
      <circle cx="1260" cy="191" r="21" stroke="#6b7742"/>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="800">
      <text x="124" y="196" fill="#1f5b61">01</text>
      <text x="352" y="196" fill="#1f5b61">02</text>
      <text x="580" y="196" fill="#1f5b61">03</text>
      <text x="808" y="196" fill="#b5792d">04</text>
      <text x="1036" y="196" fill="#1f5b61">05</text>
      <text x="1260" y="196" fill="#6b7742">06</text>
    </g>

    <g text-anchor="middle">
      <g transform="translate(124 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Intent</text><text y="229" fill="#647178" font-size="13">Objective + protocol</text><text y="310" fill="#1f5b61" font-family="ui-monospace,monospace" font-size="11">studies/*.json</text></g>
      <g transform="translate(352 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Bench</text><text y="229" fill="#647178" font-size="13">Identity + calibration</text><text y="310" fill="#1f5b61" font-family="ui-monospace,monospace" font-size="11">instruments/*.json</text></g>
      <g transform="translate(580 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Observe</text><text y="229" fill="#647178" font-size="13">Conditions + raw bytes</text><text y="310" fill="#1f5b61" font-family="ui-monospace,monospace" font-size="11">data/raw/*</text></g>
      <g transform="translate(808 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Derive</text><text y="229" fill="#647178" font-size="13">Result + uncertainty</text><text y="310" fill="#8a5b24" font-family="ui-monospace,monospace" font-size="11">analysis/*.json</text></g>
      <g transform="translate(1036 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Audit + seal</text><text y="229" fill="#647178" font-size="13">References + digests</text><text y="310" fill="#1f5b61" font-family="ui-monospace,monospace" font-size="11">seals/*.json</text></g>
      <g transform="translate(1260 0)"><text y="143" fill="#172a35" font-size="17" font-weight="700">Publish</text><text y="229" fill="#647178" font-size="13">Reviewable bundle</text><text y="310" fill="#53613a" font-family="ui-monospace,monospace" font-size="11">evidence.zip</text></g>
    </g>
    <line x1="62" y1="353" x2="1338" y2="353" stroke="#d8d5cd"/>
    <text x="62" y="386" fill="#6c777d" font-size="13">Integrity is not authenticity. Authenticity is not scientific validity. BenchLineage keeps those claims separate.</text>
  </g>
</svg>
