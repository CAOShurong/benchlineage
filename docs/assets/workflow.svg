<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img">
  <title>BenchLineage workflow from research intent to sealed evidence</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1b17"/><stop offset="1" stop-color="#102b25"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0l7 3-7 3z" fill="#78e6bd"/></marker>
  </defs>
  <rect width="1400" height="390" rx="24" fill="url(#bg)"/>
  <text x="70" y="58" fill="#78e6bd" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="2">ONE INSPECTABLE EVIDENCE CHAIN</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(55 100)"><rect width="195" height="190" rx="18" fill="#102e27" stroke="#315a50"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">01 · INTENT</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Study</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">objective</text><text x="22" y="133" fill="#a9c0ba" font-size="14">hypothesis</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">protocol</text></g>
    <g transform="translate(280 100)"><rect width="195" height="190" rx="18" fill="#102e27" stroke="#315a50"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">02 · TRACE</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Bench</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">instrument serial</text><text x="22" y="133" fill="#a9c0ba" font-size="14">calibration window</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">conditions</text></g>
    <g transform="translate(505 100)"><rect width="195" height="190" rx="18" fill="#102e27" stroke="#315a50"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">03 · OBSERVE</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Raw data</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">CSV or binary</text><text x="22" y="133" fill="#a9c0ba" font-size="14">immutable source</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">run linkage</text></g>
    <g transform="translate(730 100)"><rect width="195" height="190" rx="18" fill="#102e27" stroke="#315a50"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">04 · DERIVE</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Analysis</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">deterministic result</text><text x="22" y="133" fill="#a9c0ba" font-size="14">uncertainty budget</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">source references</text></g>
    <g transform="translate(955 100)"><rect width="195" height="190" rx="18" fill="#102e27" stroke="#315a50"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">05 · AUDIT</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Relationships</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">references</text><text x="22" y="133" fill="#a9c0ba" font-size="14">date coverage</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">orphan evidence</text></g>
    <g transform="translate(1180 100)"><rect width="165" height="190" rx="18" fill="#173d34" stroke="#78e6bd"/>
      <text x="22" y="36" fill="#78e6bd" font-size="13" font-weight="700">06 · SEAL</text>
      <text x="22" y="78" fill="#edf8f4" font-size="25" font-weight="750">Evidence</text>
      <text x="22" y="109" fill="#a9c0ba" font-size="14">file digests</text><text x="22" y="133" fill="#a9c0ba" font-size="14">root digest</text>
      <text x="22" y="157" fill="#a9c0ba" font-size="14">portable report</text></g>
  </g>
  <g stroke="#78e6bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 195h24"/><path d="M475 195h24"/><path d="M700 195h24"/><path d="M925 195h24"/><path d="M1150 195h24"/>
  </g>
  <text x="70" y="340" fill="#92aaa5" font-family="Inter,Arial,sans-serif" font-size="16">Integrity is not authenticity. Authenticity is not scientific validity. The report keeps those claims separate.</text>
</svg>
