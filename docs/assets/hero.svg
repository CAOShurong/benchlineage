<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">BenchLineage</title>
  <desc id="desc">An academic graphical abstract linking an electrical measurement to instrument, calibration, analysis, uncertainty, and sealed evidence records.</desc>
  <rect width="1400" height="520" rx="8" fill="#faf9f5"/>
  <rect x="1" y="1" width="1398" height="518" rx="7" fill="none" stroke="#d5d2ca"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="76" y="72" fill="#1f5b61" font-size="15" font-weight="800" letter-spacing="2.5">OPEN RESEARCH SOFTWARE · MEASUREMENT PROVENANCE</text>
    <text x="72" y="158" fill="#172a35" font-family="Georgia,Times New Roman,serif" font-size="74" font-weight="700">BenchLineage</text>
    <text x="76" y="205" fill="#5b6970" font-size="23">From a measured value to reviewable evidence.</text>
    <line x1="76" y1="244" x2="598" y2="244" stroke="#cbc8c0"/>
    <text x="76" y="280" fill="#172a35" font-size="14" font-weight="800">THE FAILURE IT PREVENTS</text>
    <text x="76" y="315" fill="#536269" font-size="17">The plot survives. The instrument, calibration window,</text>
    <text x="76" y="342" fill="#536269" font-size="17">raw file, conditions, and uncertainty budget do not.</text>
    <g transform="translate(76 393)">
      <circle cx="6" cy="6" r="6" fill="#1f5b61"/>
      <text x="22" y="12" fill="#3d5058" font-size="15">Offline, plain files</text>
      <circle cx="185" cy="6" r="6" fill="#b5792d"/>
      <text x="201" y="12" fill="#3d5058" font-size="15">Calibration-aware audit</text>
      <circle cx="416" cy="6" r="6" fill="#6b7742"/>
      <text x="432" y="12" fill="#3d5058" font-size="15">Verifiable ZIP bundle</text>
    </g>
    <text x="76" y="470" fill="#7a8489" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">intent → bench → raw data → analysis → seal → publication</text>
  </g>

  <g transform="translate(690 58)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="632" height="404" rx="4" fill="#fff" stroke="#c9c6be"/>
    <text x="32" y="40" fill="#172a35" font-family="Georgia,Times New Roman,serif" font-size="21" font-weight="700">Evidence lineage for run rc-baseline-001</text>
    <text x="600" y="40" text-anchor="end" fill="#758087" font-size="11">SYNTHETIC EXAMPLE</text>
    <line x1="32" y1="58" x2="600" y2="58" stroke="#d9d6cf"/>

    <g stroke="#9aa5a9" stroke-width="1.5" fill="none">
      <path d="M116 126H236M316 126H436M516 126H574"/>
      <path d="M276 158V228M476 158V228"/>
      <path d="M276 280V332H476V280"/>
    </g>
    <g>
      <rect x="38" y="94" width="156" height="64" rx="3" fill="#eef3f1" stroke="#9bb4b2"/>
      <rect x="218" y="94" width="156" height="64" rx="3" fill="#eef3f1" stroke="#9bb4b2"/>
      <rect x="398" y="94" width="156" height="64" rx="3" fill="#f7f1e8" stroke="#c7aa7c"/>
      <rect x="218" y="228" width="156" height="52" rx="3" fill="#f5f4ef" stroke="#bbb8b0"/>
      <rect x="398" y="228" width="156" height="52" rx="3" fill="#f5f4ef" stroke="#bbb8b0"/>
      <rect x="376" y="332" width="200" height="48" rx="3" fill="#edf1e8" stroke="#aab494"/>
    </g>
    <g fill="#172a35">
      <text x="54" y="118" font-size="12" font-weight="800">STUDY</text><text x="54" y="141" fill="#617078" font-size="12">RC low-pass response</text>
      <text x="234" y="118" font-size="12" font-weight="800">INSTRUMENT</text><text x="234" y="141" fill="#617078" font-size="12">scope-01 · SYN-0042</text>
      <text x="414" y="118" font-size="12" font-weight="800">CALIBRATION</text><text x="414" y="141" fill="#7b5b32" font-size="12">valid at run time</text>
      <text x="234" y="251" font-size="12" font-weight="800">RAW DATA</text><text x="234" y="270" fill="#617078" font-size="11">41-point sweep · CSV</text>
      <text x="414" y="251" font-size="12" font-weight="800">ANALYSIS</text><text x="414" y="270" fill="#617078" font-size="11">fc = 1.5749 kHz</text>
      <text x="392" y="353" font-size="11" font-weight="800">SEALED EVIDENCE ROOT</text>
      <text x="392" y="371" fill="#53613a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">sha256:db35e8d4…</text>
    </g>
    <circle cx="590" cy="356" r="15" fill="#6b7742"/>
    <path d="M583 356l5 5 10-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
