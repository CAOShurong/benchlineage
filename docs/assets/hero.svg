<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">BenchLineage: trace an engineering result back to its evidence</title>
  <desc id="desc">A concrete three-step example showing a measured cutoff frequency, the files and equipment linked to it, and the checks another researcher can run later.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#56747A"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="10" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1438" height="618" rx="9" fill="none" stroke="#D4D1C8" stroke-width="2"/>
  <rect width="1440" height="12" rx="10" fill="#17324D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="54" fill="#2B6F6B" font-size="14" font-weight="700" letter-spacing="3">LOCAL-FIRST RECORDS FOR ELECTRICAL ENGINEERING</text>
    <text x="720" y="122" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">BenchLineage</text>
    <text x="720" y="161" fill="#59676F" font-size="20">Trace a reported number back to the instrument, raw data, and analysis that produced it.</text>
    <text x="720" y="194" fill="#7A7064" font-size="13">FICTIONAL RC FILTER EXAMPLE</text>
  </g>

  <path d="M442 354H512M912 354H982" fill="none" stroke="#56747A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(60 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#E8F0EF"/>
      <rect y="44" width="382" height="8" fill="#E8F0EF"/>
      <circle cx="191" cy="0" r="22" fill="#2B6F6B"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">1</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">MEASURE</text>
      <text x="191" y="91" fill="#59676F" font-size="13">Reported result</text>
      <text x="191" y="137" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="700">1.575 kHz</text>
      <text x="191" y="166" fill="#59676F" font-size="14">RC low-pass cutoff frequency</text>
      <line x1="42" y1="190" x2="340" y2="190" stroke="#DDD9D0"/>
      <text x="191" y="219" fill="#354A55" font-size="13">Run time · room conditions · operator</text>
      <text x="191" y="244" fill="#2B6F6B" font-size="12" font-weight="700">RECORDED WITH THE RESULT</text>
    </g>

    <g transform="translate(529 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#EDF0F4"/>
      <rect y="44" width="382" height="8" fill="#EDF0F4"/>
      <circle cx="191" cy="0" r="22" fill="#17324D"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">2</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">LINK THE EVIDENCE</text>
      <text x="191" y="91" fill="#59676F" font-size="13">Every statement points to a file</text>
      <text x="191" y="126" fill="#172635" font-size="14" font-weight="700">Oscilloscope</text>
      <text x="191" y="148" fill="#59676F" font-size="13">scope-01 · calibration valid on run date</text>
      <text x="191" y="183" fill="#172635" font-size="14" font-weight="700">Raw measurement</text>
      <text x="191" y="205" fill="#59676F" font-family="Consolas, monospace" font-size="12">data/raw/rc-sweep.csv</text>
      <text x="191" y="237" fill="#172635" font-size="14" font-weight="700">Analysis recipe</text>
      <text x="191" y="257" fill="#59676F" font-family="Consolas, monospace" font-size="12">analysis/cutoff.json</text>
    </g>

    <g transform="translate(998 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#F3EDE2"/>
      <rect y="44" width="382" height="8" fill="#F3EDE2"/>
      <circle cx="191" cy="0" r="22" fill="#B07A2A"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">3</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">VERIFY LATER</text>
      <text x="191" y="91" fill="#59676F" font-size="13">A collaborator can check three things</text>
      <circle cx="64" cy="129" r="10" fill="#2B6F6B"/>
      <path d="M59 129l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="205" y="134" fill="#354A55" font-size="14">All referenced files are present</text>
      <circle cx="64" cy="174" r="10" fill="#2B6F6B"/>
      <path d="M59 174l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="205" y="179" fill="#354A55" font-size="14">Recorded bytes have not changed</text>
      <circle cx="64" cy="219" r="10" fill="#2B6F6B"/>
      <path d="M59 219l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="205" y="224" fill="#354A55" font-size="14">One portable evidence bundle opens</text>
    </g>

    <line x1="60" y1="535" x2="1380" y2="535" stroke="#D4D1C8"/>
    <text x="720" y="572" fill="#17324D" font-size="16" font-weight="700">Six months later, the number still has a traceable history.</text>
    <text x="720" y="596" fill="#69757B" font-size="12">Integrity checks protect the recorded files; scientific validity still requires expert review.</text>
  </g>
</svg>
